<style>  
html, body{  
    margin:0;  
    padding:0;  
    background:#000;  
    font-family:'Segoe UI',sans-serif;  
    overflow-x:hidden;  
    color:white;  
}  
  
canvas{  
    position:fixed;  
    top:0;  
    left:0;  
    z-index:0;  
}  

.screen {
    display: none;
    position: relative;
    z-index: 2;
}

.screen.active {
    display: block;

/* --- ANIMAÇÃO DO AVIÃO NA TELA INICIAL E PAINEL --- */
.aviator-hero {
    position: relative;
    width: 100%;
    height: 140px;
    margin-bottom: 10px;
    overflow: hidden;
}

.plane {
    position: absolute;
    width: 50px;
    height: 30px;
    bottom: 20px;
    left: -60px;
    animation: flyAviator 3.5s infinite linear;
}

.plane svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 10px #ff3300);
}

@keyframes flyAviator {
    0% { left: -60px; bottom: 10px; transform: rotate(10deg) scale(0.8); }
    50% { left: 45%; bottom: 60px; transform: rotate(18deg) scale(1.1); }
    85% { left: 85%; bottom: 110px; transform: rotate(25deg) scale(1.2); }
    100% { left: 110%; bottom: 150px; transform: rotate(30deg) scale(1); }
}

/* --- ANIMAÇÃO DE VOO COMPLETA NO DISPLAY --- */
.flight-stage {
    position: relative;
    width: 100%;
    height: 120px;
    background: radial-gradient(circle at bottom left, rgba(255, 51, 0, 0.2), transparent 70%);
    border: 1px dashed rgba(255, 111, 51, 0.3);
    border-radius: 10px;
    margin: 10px 0;
    overflow: hidden;
}

.flying-plane {
    position: absolute;
    width: 32px;
    height: 32px;
    bottom: 10px;
    left: -40px;
    animation: flightPath 2.5s infinite ease-out;
}

@keyframes flightPath {
    0% { left: -10%; bottom: 5px; transform: rotate(5deg); }
    40% { left: 35%; bottom: 30px; transform: rotate(20deg); }
    80% { left: 75%; bottom: 75px; transform: rotate(35deg); }
    100% { left: 105%; bottom: 110px; transform: rotate(40deg); }
}

<!-- Canvas Background -->
<script>  
const canvas = document.getElementById('matrix');  
const ctx = canvas.getContext('2d');  
canvas.width = window.innerWidth;  
canvas.height = window.innerHeight;  
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&";  
const fontSize = 14;  
const columns = canvas.width / fontSize;  
const drops = Array.from({length: columns}).fill(1);  
  
function drawMatrix(){  
    ctx.fillStyle = "rgba(0,0,0,0.05)";  
    ctx.fillRect(0,0,canvas.width,canvas.height);  
    ctx.fillStyle = "#f15a29";  
    ctx.font = fontSize + "px monospace";  
    for(let i=0;i<drops.length;i++){  
        const text = letters.charAt(Math.floor(Math.random() * letters.length));  
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);  
        if(drops[i] * fontSize > canvas.height && Math.random() > 99.975){ drops[i] = 0; }  
        drops[i]++;  
    }  
}  
setInterval(drawMatrix,33);  

const fireCanvas = document.getElementById('fire');  
const fireCtx = fireCanvas.getContext('2d');  
fireCanvas.width = window.innerWidth;  
fireCanvas.height = window.innerHeight;  
const particles = [];  
for(let i=0;i<120;i++){  
    particles.push({  
        x:Math.random() * fireCanvas.width,  
        y:Math.random() * fireCanvas.height,  
        radius:Math.random() * 3 + 1,  
        alpha:Math.random() * 0.5 + 0.3,  
        dx:(Math.random()-0.5) * 0.5,  
        dy:-Math.random() * 1.5 - 0.5  
    });  
}  
function drawFire(){  
    fireCtx.clearRect(0,0,fireCanvas.width,fireCanvas.height);  
    particles.forEach(p => {  
        fireCtx.beginPath();  
        fireCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);  
        fireCtx.fillStyle = `rgba(255,${Math.floor(Math.random()*150)},0,${p.alpha})`;  
        fireCtx.fill();  
        p.x += p.dx; p.y += p.dy;  
        if(p.y < 0){ p.y = fireCanvas.height; p.x = Math.random() * fireCanvas.width; }  
    });  
    requestAnimationFrame(drawFire);  
}  
drawFire();  
</script>  

<!-- ÁUDIO E LÓGICA DO BOT IA -->
<script>  
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundEnabled = true;

function toggleAudio(e) {
    if(e) e.stopPropagation();
    soundEnabled = !soundEnabled;
    const btn = document.getElementById("btnMusicToggle");
    
    if (soundEnabled) {
        btn.innerText = "🔔 Som de Sinal: ON";
        btn.style.background = "#ff6f33";
        btn.style.color = "#000";
    } else {
        btn.innerText = "🔕 Som de Sinal: OFF";
        btn.style.background = "#222";
        btn.style.color = "#ff6f33";
    }
}

function playWinSoundOnce() {
    if (!soundEnabled) return;
    
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, now); 
    osc.frequency.setValueAtTime(880, now + 0.1); 

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.3);
}

function fazerLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    if (email === "Jatildclimacond@gmail.com" && password === "2026") {

        document.getElementById("screen2").classList.add("active");
        atualizarConexaoBot();
    } else {
        alert("E-mail ou palavra-passe incorretos!");
    }
}

function fazerLogout() {
    document.getElementById("screen2").classList.remove("active");
    document.getElementById("screen1").classList.add("active");
}

function atualizarConexaoBot() {
    const platform = document.getElementById("platformSelect").value;
    document.getElementById("botStatus").innerText = `🤖 BOT IA Conectado: ${platform}`;
    document.getElementById("riskMessage").innerText = `Pronto para analisar padrão do Aviator na ${platform}`;
    document.getElementById("riskMessage").style.color = "#aaa";
}

function crashPointFromHash(hash){  
    const h = parseInt(hash.substring(0,13),16);  
    if(h % 33 === 0){ return 3.00; }  
    return Math.floor((100 * (Math.pow(2,52)-1)) / (Math.pow(2,52)-h)) / 100;  
}  
  
function generateHash(serverSeed, clientSeed, nonce){  
    return CryptoJS.SHA256(`${serverSeed}:${clientSeed}:${nonce}`).toString();  
}  
  
function getFutureTime(offset){  
    const now = new Date();  
    now.setMinutes(now.getMinutes() + offset);  
    return now.toTimeString().slice(0,8);  
}  

function buscarEntrada(){  
    const serverSeed = document.getElementById("serverSeedInput").value.trim();  
    const platform = document.getElementById("platformSelect").value;
  
    if(!serverSeed){  
        alert("Insira o server_seed real da rodada.");  
        return;  
    }  

    document.getElementById("multiplierDisplay").innerText = "ANALISANDO...";
    document.getElementById("riskMessage").innerText = `🤖 BOT IA lendo o algoritmo de aviator na ${platform}...`;
    document.getElementById("riskMessage").style.color = "#ffcc00";

    setTimeout(() => {
        let tenta = 0;  
        let achou = false;  
      
        while(tenta < 1000){  
            const clientSeed = Math.random().toString(36).substring(3,12);  
            const nonce = Math.floor(Math.random() * 10000);  
            const hash = generateHash(serverSeed, clientSeed, nonce);  
            const multiplier = crashPointFromHash(hash);  

            if (multiplier >= 3.30) {  
                const horario = getFutureTime((tenta % 10) + 1);  

                document.getElementById("multiplierDisplay").innerText =  
                    `⏰ ${horario}\n🎯 ${multiplier.toFixed(2)}x`;  
      
                document.getElementById("riskMessage").innerText =  
                    `🤖 SINAL BOT IA [${platform}]: Entrada Confirmada! (98% Assertividade)`;  
      
                document.getElementById("riskMessage").style.color = "#00ff88";  
      
                playWinSoundOnce(); 
                achou = true;  
                break;  
            }  
            tenta++;  
        }  
      
        if(!achou){  
            document.getElementById("riskMessage").innerText = `🤖 BOT IA: Nenhuma entrada segura encontrada na ${platform}.`;  
            document.getElementById("riskMessage").style.color = "#ff4444";
            document.getElementById("multiplierDisplay").innerText = "--";  
        }  
    }, 600);
}  
</script>
